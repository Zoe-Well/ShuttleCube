        impact_snapshot: { type: object, additionalProperties: true }
        status: { type: string, enum: [proposed, awaiting_approval, executing, succeeded, failed, uncertain, cancelled] }
        result_summary: { type: [string, 'null'] }
        error_summary: { type: [string, 'null'] }
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, modified, expired, stale, cancelled]
    ApprovalRequest:
      type: object
      required: [id, run_id, tool_call_id, risk_level, action_summary, normalized_input, impact_snapshot, business_versions, status, requested_at, version]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        tool_call_id: { type: string, format: uuid }
        risk_level: { type: string, enum: [high] }
        action_summary: { type: string }
        normalized_input: { type: object, additionalProperties: true }
        impact_snapshot: { type: object, additionalProperties: true }
        business_versions:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        decision_by: { type: [string, 'null'], format: uuid }
        decision_reason: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject, modify] }
        reason: { type: [string, 'null'], maxLength: 1000 }
        modified_input:
          type: [object, 'null']
          additionalProperties: true
    AgentArtifact:
      type: object
      required: [id, run_id, kind, name, media_type, size_bytes, checksum, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        step_id: { type: [string, 'null'], format: uuid }
        kind: { type: string }
        name: { type: string }
        media_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        checksum: { type: string }
        created_at: { type: string, format: date-time }
        download_url: { type: [string, 'null'], format: uri-reference }
    AgentBudgetPolicy:
      type: object
      required: [on_limit]
      properties:
        max_input_tokens: { type: [integer, 'null'], minimum: 1 }
        max_output_tokens: { type: [integer, 'null'], minimum: 1 }
        max_cost: { anyOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        max_tool_calls: { type: [integer, 'null'], minimum: 1 }
        max_duration_seconds: { type: [integer, 'null'], minimum: 1 }
        max_steps: { type: [integer, 'null'], minimum: 1 }
        on_limit: { type: string, enum: [pause, fail] }
    AgentUsageSummary:
      type: object
      required: [input_tokens, output_tokens, tool_calls, steps, estimated_cost]
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        tool_calls: { type: integer, minimum: 0 }
        steps: { type: integer, minimum: 0 }
        estimated_cost: { $ref: '#/components/schemas/Money' }
