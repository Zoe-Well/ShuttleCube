      tags: [Finance]
      summary: 上传付款凭证
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [owner_type, owner_id, file]
              properties:
                owner_type:
                  type: string
                  enum: [payment, refund, expense, payroll_settlement]
                owner_id: { type: string, format: uuid }
                file: { type: string, format: binary }
