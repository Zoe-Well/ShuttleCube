openapi: 3.1.0
info:
  title: ShuttleCube Internal Management API
  version: 0.1.0
  description: |
    羽毛球培训与场地经营管理系统的同源内部接口契约。
    该接口仅供已登录管理界面使用，不是外部公共 API。
    `/agents`、`/workflows`、`/agent-runs` 和 `/approval-requests` 为未来 Agent 契约草案，
    当前版本不得实现、生成客户端调用或作为验收范围。
x-future-path-prefixes: [/agents, /workflows, /agent-runs, /approval-requests]
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Session
  - name: Setup
  - name: DataTransfer
  - name: Directory
  - name: Schedule
  - name: Classes
  - name: Customers
  - name: PrivateLessons
  - name: VenueBookings
  - name: Events
  - name: Finance
  - name: Payroll
  - name: Dashboard
  - name: Agents
    description: FUTURE DRAFT — current release must not implement
  - name: Workflows
    description: FUTURE DRAFT — current release must not implement
  - name: AgentRuns
    description: FUTURE DRAFT — current release must not implement
  - name: Approvals
    description: FUTURE DRAFT — current release must not implement

paths:
  /session:
    get:
      tags: [Session]
      summary: 获取当前登录用户
      operationId: getSession
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /session/login:
    post:
      tags: [Session]
      summary: 登录内部管理系统
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1 }
                password: { type: string, minLength: 1 }
      responses:
        '204': { description: 登录成功并建立安全会话 }
        '401':
          description: 用户名或密码错误
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /session/logout:
    post:
      tags: [Session]
      summary: 退出当前会话
      operationId: logout
      responses:
        '204': { description: 已退出 }

  /setup/status:
    get:
      tags: [Setup]
      summary: 检查是否需要首次启动初始化
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: 初始化状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
  /setup:
    post:
      tags: [Setup]
      summary: 创建首个管理员、场馆和场地
      operationId: performSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupInput' }
      responses:
        '201':
          description: 初始化完成并建立会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }

  /data-transfer/status:
    get:
      tags: [DataTransfer]
      summary: 获取本机数据目录和占用情况
      operationId: getDataTransferStatus
      responses:
        '200':
          description: 本机数据状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataTransferStatus' }
  /data-transfer/export:
    post:
      tags: [DataTransfer]
      summary: 导出完整迁移文件夹
      operationId: exportDataTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferFolderInput' }
      responses:
        '200':
          description: 导出位置
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties: { path: { type: string } }
  /data-transfer/validate:
    post:
      tags: [DataTransfer]
      summary: 校验迁移文件夹
      operationId: validateDataTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferFolderInput' }
      responses:
        '200':
          description: 迁移包信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
  /data-transfer/import:
    post:
      tags: [DataTransfer]
      summary: 暂存迁移数据并在重启后恢复
      operationId: importDataTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferFolderInput' }
      responses:
        '200':
          description: 数据已通过校验并等待重启恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }

  /courts:
    get:
      tags: [Directory]
      summary: 查询场地
      operationId: listCourts
      responses:
        '200':
          description: 场地列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Court' }
    post:
      tags: [Directory]
      summary: 新增场地
      operationId: createCourt
      requestBody:
        $ref: '#/components/requestBodies/CourtWrite'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Court' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /coaches:
    get:
      tags: [Directory]
      summary: 查询教练
      operationId: listCoaches
      responses:
        '200':
          description: 教练列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Coach' }
    post:
      tags: [Directory]
      summary: 新增教练
      operationId: createCoach
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoachWrite' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coach' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /coaches/{coach_id}:
    put:
      tags: [Directory]
      summary: 编辑教练资料
      operationId: updateCoach
      parameters:
        - name: coach_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoachUpdate' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coach' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /coaches/{coach_id}/rates:
    get:
      tags: [Directory]
      summary: 查询教练固定班和私教费用标准历史
      operationId: listCoachRates
      parameters:
        - name: coach_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 按业务类型和生效日期倒序返回费用标准
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CoachRate' }
        '404': { description: 教练不存在 }
  /venue/settings:
    get:
      tags: [Directory]
      summary: 获取机构营业设置
      operationId: getVenueSettings
      responses:
        '200':
          description: 当前设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueSettings' }
    put:
      tags: [Directory]
      summary: 更新机构营业设置
      operationId: updateVenueSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueSettingsWrite' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueSettings' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }

  /students:
    get:
      tags: [Customers]
      summary: 查询学员
      operationId: listStudents
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 分页学员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPage' }
    post:
      tags: [Customers]
      summary: 新增学员及家长关联
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentWrite' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /students/{student_id}/entitlements:
    get:
      tags: [Customers]
      summary: 聚合查询学员全部培训权益
      operationId: getStudentEntitlements
      parameters:
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 固定班和私教课包权益
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentEntitlements' }
  /students/{student_id}/entitlements/fixed-classes:
    post:
      tags: [Customers]
      summary: 为学员添加固定班权益
      operationId: addStudentFixedClassEntitlement
      parameters:
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedClassEntitlementWrite' }
      responses:
        '201': { description: 权益已创建 }
  /students/{student_id}/entitlements/private-packages:
    post:
      tags: [Customers]
      summary: 为学员添加私教课包
      operationId: addStudentPrivatePackageEntitlement
      parameters:
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentPrivatePackageWrite' }
      responses:
        '201': { description: 权益已创建 }
  /students/{student_id}/entitlements/fixed-classes/{enrollment_id}/transfer:
    post:
      tags: [Customers]
      summary: 将固定班培训权益整体转移到其他固定班
      operationId: transferStudentFixedClassEntitlement
      parameters:
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: enrollment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedClassEntitlementTransferWrite' }
      responses:
        '201': { description: 原权益已转出，目标权益已创建且不新增应收 }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /students/{student_id}/entitlements/{entitlement_type}/{entitlement_id}/terminate:
    post:
      tags: [Customers]
      summary: 软终止学员培训权益
      operationId: terminateStudentEntitlement
      parameters:
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: entitlement_type
          in: path
          required: true
          schema: { type: string, enum: [fixed_class, private_package] }
        - name: entitlement_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntitlementTerminateWrite' }
      responses:
        '200': { description: 权益已终止并保留历史 }
        '409': { $ref: '#/components/responses/ConcurrentChange' }

  /schedule:
    get:
      tags: [Schedule]
      summary: 查询统一排期
      operationId: listSchedule
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: court_id
          in: query
          schema: { type: string, format: uuid }
        - name: source_type
          in: query
          schema: { $ref: '#/components/schemas/ScheduleSourceType' }
      responses:
        '200':
          description: 指定范围内的排期
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScheduleEntry' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/conflicts:check:
    post:
      tags: [Schedule]
      summary: 在保存前预检资源冲突
      operationId: checkScheduleConflicts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCandidate' }
      responses:
        '200':
          description: 冲突检查结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConflictCheckResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/bulk-delete:
    post:
      tags: [Schedule]
      summary: 批量永久删除统一排期中的可删除业务
      operationId: bulkDeleteSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCancelWrite' }
      responses:
        '200':
          description: 已批量永久删除
        '404': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/{schedule_id}/cancel:
    post:
      tags: [Schedule]
      summary: 取消排期并释放资源
      operationId: cancelSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleEntry' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /schedule/{schedule_id}:
    delete:
      tags: [Schedule]
      summary: 永久删除排期及资源占用
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelWrite' }
      responses:
        '204': { description: 已永久删除 }
        '409': { $ref: '#/components/responses/ConcurrentChange' }

  /classes:
    get:
      tags: [Classes]
      summary: 查询固定班
      operationId: listClasses
      parameters:
        - name: business_date
          in: query
          schema: { type: string, format: date }
        - name: ending_within_days
          in: query
          description: 只返回最后一节未来课程在所选天数内的有效班级
          schema: { type: integer, enum: [7, 15, 30] }
      responses:
        '200':
          description: 固定班列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FixedClassAttentionView' }
    post:
      tags: [Classes]
      summary: 创建固定班并生成课程实例
      operationId: createClass
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedClassWrite' }
      responses:
        '201':
          description: 固定班及课程实例已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixedClassCreated' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{class_id}:
    get:
      tags: [Classes]
      summary: 查询固定班课程、报名与收费详情
      operationId: getClass
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 固定班详情，报名收费按实际资金事实汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixedClassDetail' }
        '404': { description: 固定班不存在 }
  /classes/{class_id}/capacity:
    patch:
      tags: [Classes]
      summary: 修改固定班最大人数
      operationId: updateFixedClassCapacity
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedClassCapacityWrite' }
      responses:
        '200': { description: 班级容量已更新 }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{class_id}/renew:
    post:
      tags: [Classes]
      summary: 固定班续期并可同步学员课时与应收
      operationId: renewFixedClass
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedClassRenewalWrite' }
      responses:
        '200': { description: 新课程及所选学员续期已统一保存 }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /classes/{class_id}/archive:
    post:
      tags: [Classes]
      summary: 归档固定班并释放未来排期
      operationId: archiveFixedClass
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixedClassArchiveWrite' }
      responses:
        '200': { description: 固定班已归档，关联权益已失效 }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /classes/{class_id}/enrollments:
    post:
      tags: [Classes]
      summary: 为系统内有效学员创建固定班报名（兼容接口）
      description: 管理端日常流程应从学员档案绑定固定班培训权益；该接口保留给既有客户端，并拒绝不存在或已停用的学员。
      operationId: createEnrollment
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentWrite' }
      responses:
        '201':
          description: 报名及初始课时流水已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '404': { description: 学员或固定班不存在 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /class-sessions/{session_id}/attendance:finalize:
    post:
      tags: [Classes]
      summary: 完成课程考勤、扣课并生成教练费用
      operationId: finalizeAttendance
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceFinalizeCommand' }
      responses:
        '200':
          description: 考勤已完成，返回课时和教练费用结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceFinalizeResult' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /class-sessions/{session_id}/cancel-and-replace:
    post:
      tags: [Classes]
      summary: 机构取消课程并补排
      operationId: cancelAndReplaceClassSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelAndReplaceCommand' }
      responses:
        '200':
          description: 原课已取消并创建补排课
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelAndReplaceResult' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /class-sessions/{session_id}/reschedule:
    post:
      tags: [Classes]
      summary: 修改单节固定班课程时间
      operationId: rescheduleClassSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassSessionRescheduleWrite' }
      responses:
        '200': { description: 课程时间及统一排期已更新 }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /class-sessions/{session_id}/replacement:
    post:
      tags: [Classes]
      summary: 为待补排的取消课程安排整班补排
      operationId: scheduleCancelledClassSessionReplacement
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassSessionReplacementWrite' }
      responses:
        '201': { description: 补排课程已生成到课程计划 }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /private-packages:
    get:
