          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '413':
          description: 文件过大
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: 不支持的图片格式
