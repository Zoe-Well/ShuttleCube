      tags: [Finance]
      summary: 鉴权查看私有凭证内容
      operationId: downloadAttachment
      responses:
        '200':
          description: 私有凭证图片
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
  /attachments/{attachment_id}:
    delete:
      tags: [Finance]
      summary: 软删除凭证并保留审计
      operationId: deleteAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidWrite' }
      responses:
        '204': { description: 凭证已删除 }

  /coach-fees:
    get:
      tags: [Payroll]
      summary: 查询教练费用
      operationId: listCoachFees
      parameters:
        - name: coach_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, settled, void]
      responses:
        '200':
          description: 教练费用明细和汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachFeeSummary' }
  /coach-fees/{fee_id}:
    get:
      tags: [Payroll]
      summary: 查询单笔教练费用
      operationId: getCoachFee
      parameters:
        - name: fee_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 教练费用详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachFee' }
        '404': { description: 教练费用不存在 }
    patch:
      tags: [Payroll]
      summary: 有原因地调整待结教练费用
      operationId: adjustCoachFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustment_amount, reason, version]
              properties:
                adjustment_amount: { $ref: '#/components/schemas/Money' }
                reason: { type: string, minLength: 1 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 教练费用已调整
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachFee' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /payroll-settlements:
    get:
      tags: [Payroll]
      summary: 查询教练结算历史
      operationId: listPayrollSettlements
      parameters:
        - name: coach_id
          in: query
          schema: { type: string, format: uuid }
        - name: period_month
          in: query
          description: 所查自然月的任意日期，服务端归一为月初
          schema: { type: string, format: date }
      responses:
        '200':
          description: 结算历史
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayrollSettlementResult' }
    post:
      tags: [Payroll]
      summary: 结算教练费用并生成工资支出
      operationId: createPayrollSettlement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayrollSettlementWrite' }
      responses:
        '201':
          description: 结算和工资支出已原子创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollSettlementResult' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /payroll-settlements/{settlement_id}:
    get:
      tags: [Payroll]
      summary: 获取结算、费用和工资支出详情
      operationId: getPayrollSettlement
      responses:
        '200':
          description: 结算详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollSettlementResult' }
  /payroll-settlements/{settlement_id}/void:
    post:
      tags: [Payroll]
      summary: 冲正错误结算并恢复待结费用
      operationId: voidPayrollSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidWrite' }
      responses:
        '200':
          description: 结算已冲正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollSettlementResult' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: 获取当日待办和本月经营摘要
      operationId: getDashboard
      parameters:
        - name: business_date
          in: query
          schema: { type: string, format: date }
        - name: ending_within_days
          in: query
          schema: { type: integer, enum: [7, 15, 30], default: 30 }
      responses:
        '200':
          description: 工作台摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /dashboard/pending-attendance:
    get:
      tags: [Dashboard]
      summary: 获取今日跨班级待考勤课次
      operationId: listTodayPendingAttendance
      parameters:
        - name: business_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 今日待考勤课次
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingAttendance' }
  /reports/operations:
    get:
      tags: [Dashboard]
      summary: 获取指定期间经营统计
      operationId: getOperationsReport
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 收付、欠费、结算和场地使用统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsReport' }
  /audit:
    get:
      tags: [Audit]
      summary: 按操作人、动作、实体和时间查询审计
      operationId: listAuditLogs
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action_type, in: query, schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: occurred_from, in: query, schema: { type: string, format: date-time } }
        - { name: occurred_to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
  /audit/entities/{entity_type}/{entity_id}:
    get:
      tags: [Audit]
      summary: 查询单个业务实体的完整变更历史
      operationId: getEntityAuditHistory
      responses:
        '200':
          description: 实体审计时间线
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
  /audit/requests/{request_id}:
    get:
      tags: [Audit]
      summary: 查询一次请求产生的跨实体审计
      operationId: getAuditRequestTrace
      responses:
        '200':
          description: 请求审计链
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }

  /agents:
    get:
      tags: [Agents]
      summary: 获取可用 Agent 定义
      operationId: listAgents
      responses:
        '200':
          description: Agent 定义列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentDefinition' }

  /workflows:
    get:
      tags: [Workflows]
      summary: 获取工作流及当前发布版本
      operationId: listWorkflows
      responses:
        '200':
          description: 工作流列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkflowSummary' }
    post:
      tags: [Workflows]
      summary: 创建工作流草稿
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowDraftWrite' }
      responses:
        '201':
          description: 草稿已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workflows/{workflow_id}/versions/{version_number}:validate:
    post:
      tags: [Workflows]
      summary: 验证工作流图、工具、风险政策和预算
      operationId: validateWorkflowVersion
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/WorkflowVersionNumber'
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowValidationResult' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /workflows/{workflow_id}/versions/{version_number}:publish:
    post:
      tags: [Workflows]
      summary: 发布不可变工作流版本
      operationId: publishWorkflowVersion
      parameters:
        - $ref: '#/components/parameters/WorkflowId'
        - $ref: '#/components/parameters/WorkflowVersionNumber'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: 已发布版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /agent-runs:
    get:
      tags: [AgentRuns]
      summary: 查询 Agent 运行历史
      operationId: listAgentRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AgentRunStatus' }
      responses:
        '200':
          description: 运行分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunPage' }
    post:
      tags: [AgentRuns]
      summary: 启动 Agent 目标或已发布工作流
      operationId: createAgentRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRunCreate' }
      responses:
        '202':
          description: 运行已持久化并排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRun' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /agent-runs/{run_id}:
    get:
      tags: [AgentRuns]
      summary: 获取运行、步骤、工具与审批摘要
      operationId: getAgentRun
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: 运行详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunDetail' }
        '404': { $ref: '#/components/responses/ValidationError' }
  /agent-runs/{run_id}/events:
    get:
      tags: [AgentRuns]
      summary: 订阅并回放 Agent 运行事件
      operationId: streamAgentRunEvents
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - name: after
          in: query
          description: 已收到的最后事件序号；也可使用 Last-Event-ID
          schema: { type: integer, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: text/event-stream；每个事件的 id 为持久化 sequence
          content:
            text/event-stream:
              schema: { type: string }
  /agent-runs/{run_id}:pause:
    post:
      tags: [AgentRuns]
      summary: 在安全检查点暂停运行
      operationId: pauseAgentRun
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '202':
          description: 暂停已请求或已完成
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRun' } } }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /agent-runs/{run_id}:resume:
    post:
      tags: [AgentRuns]
      summary: 从最近安全检查点恢复运行
      operationId: resumeAgentRun
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '202':
          description: 恢复已排队
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRun' } } }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /agent-runs/{run_id}:cancel:
    post:
      tags: [AgentRuns]
      summary: 取消运行及尚未执行的工具
      operationId: cancelAgentRun
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '202':
          description: 取消已请求或已完成
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRun' } } }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
  /agent-runs/{run_id}:retry:
    post:
      tags: [AgentRuns]
      summary: 按风险策略重试失败步骤
      operationId: retryAgentRun
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '202':
          description: 允许的重试已排队
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRun' } } }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /agent-runs/{run_id}/artifacts:
    get:
      tags: [AgentRuns]
      summary: 获取运行产物
      operationId: listAgentArtifacts
      parameters:
        - $ref: '#/components/parameters/AgentRunId'
      responses:
        '200':
          description: 受保护产物元数据
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgentArtifact' }

  /approval-requests:
    get:
      tags: [Approvals]
      summary: 查询待处理和历史审批
      operationId: listApprovalRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200':
          description: 审批列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalRequest' }
  /approval-requests/{approval_id}:decide:
    post:
      tags: [Approvals]
      summary: 批准、拒绝或修改审批
      operationId: decideApprovalRequest
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IfMatchVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        '200':
          description: 审批决定已记录；批准仍需执行前版本复核
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '409': { $ref: '#/components/responses/ConcurrentChange' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shuttlecube_session

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 100 }
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowVersionNumber:
      name: version_number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceivableId:
      name: receivable_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一用户和命令作用域内唯一的重试标识
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: 客户端最后读取的实体版本，例如 `"7"`
      schema: { type: string }

  requestBodies:
    CourtWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, name]
            properties:
              code: { type: string, minLength: 1, maxLength: 20 }
              name: { type: string, minLength: 1, maxLength: 100 }
              notes: { type: [string, 'null'], maxLength: 1000 }

  responses:
    Unauthenticated:
      description: 未登录或会话已失效
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: 输入或业务规则校验失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    ConcurrentChange:
      description: 记录版本已变化或目标事实已被其他操作处理
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ScheduleConflict:
      description: 一个或多个资源发生排期冲突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ScheduleConflictProblem' }

  schemas:
    IdentifierVersion:
      type: object
      required: [id, version]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ['120.00']
    Problem:
      type: object
      required: [type, title, status, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    ScheduleConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [conflicts]
          properties:
            conflicts:
              type: array
              items: { $ref: '#/components/schemas/ScheduleConflict' }
    SessionView:
      type: object
      required: [user_id, display_name, csrf_token]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        csrf_token: { type: string }
    SetupStatus:
      type: object
      required: [required, desktop_mode]
      properties:
        required: { type: boolean }
        desktop_mode: { type: boolean }
    SetupInput:
      type: object
      required: [venue_name, court_count, username, display_name, password]
      properties:
        venue_name: { type: string, minLength: 1, maxLength: 120 }
        court_count: { type: integer, minimum: 1, maximum: 50 }
        username: { type: string, minLength: 1, maxLength: 80 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 8, maxLength: 200 }
    DataTransferStatus:
      type: object
      required: [desktop_mode, database_size_bytes, attachment_size_bytes, pending_import]
      properties:
        desktop_mode: { type: boolean }
        data_directory: { type: [string, 'null'] }
        database_size_bytes: { type: integer, minimum: 0 }
        attachment_size_bytes: { type: integer, minimum: 0 }
        pending_import: { type: boolean }
    TransferFolderInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 2048 }
    ImportResult:
      type: object
      required: [app_version, schema_version, exported_at, restart_required]
      properties:
        app_version: { type: string }
        schema_version: { type: string }
        exported_at: { type: string, format: date-time }
        restart_required: { type: boolean }
    Court:
      allOf:
        - $ref: '#/components/schemas/IdentifierVersion'
        - type: object
          required: [code, name, status]
          properties:
            code: { type: string }
            name: { type: string }
            status: { type: string, enum: [active, inactive] }
            notes: { type: [string, 'null'] }
    CoachWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: [string, 'null'] }
        teaching_tags: { type: array, items: { type: string } }
        notes: { type: [string, 'null'] }
        fixed_class_fee:
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
          description: 固定班单节默认教练费；为空时不变更标准
        private_lesson_fee:
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
          description: 私教单节默认教练费；为空时不变更标准
        rate_effective_from: { type: [string, 'null'], format: date }
    CoachUpdate:
      allOf:
        - $ref: '#/components/schemas/CoachWrite'
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    Coach:
      allOf:
        - $ref: '#/components/schemas/IdentifierVersion'
        - $ref: '#/components/schemas/CoachWrite'
        - type: object
          required: [is_active, fixed_class_fee, private_lesson_fee]
          properties:
            is_active: { type: boolean }
            fixed_class_fee: { $ref: '#/components/schemas/Money' }
            private_lesson_fee: { $ref: '#/components/schemas/Money' }
            fixed_class_fee_effective_from: { type: [string, 'null'], format: date }
            private_lesson_fee_effective_from: { type: [string, 'null'], format: date }
    CoachRate:
      allOf:
        - $ref: '#/components/schemas/IdentifierVersion'
        - type: object
          required: [business_type, amount, effective_from]
          properties:
