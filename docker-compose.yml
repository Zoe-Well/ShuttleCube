services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shuttlecube}
      POSTGRES_USER: ${POSTGRES_USER:-shuttlecube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shuttlecube}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shuttlecube"], interval: 5s, timeout: 5s, retries: 10 }
  object-storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shuttlecube}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shuttlecube-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [object-data:/data]
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      SHUTTLECUBE_DATABASE_URL: postgresql+psycopg://shuttlecube:shuttlecube@postgres:5432/shuttlecube
      SHUTTLECUBE_SECRET_KEY: compose-local-secret-change-me
      SHUTTLECUBE_S3_ENDPOINT: http://object-storage:9000
      SHUTTLECUBE_S3_BUCKET: shuttlecube
      SHUTTLECUBE_S3_ACCESS_KEY: shuttlecube
      SHUTTLECUBE_S3_SECRET_KEY: shuttlecube-local-secret
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
  nginx:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes: ["./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, frontend]
volumes: { postgres-data: {}, object-data: {} }
